x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: ingestion-airflow/docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL:-http://airflow-api-server:8080/execution/}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_METADATA_DSN:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/data_lake}
    AIRFLOW__API__BASE_URL: ${AIRFLOW__API__BASE_URL:-http://localhost:8088}
    AIRFLOW__API__WORKERS: ${AIRFLOW__API__WORKERS:-1}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow-execution-api-jwt-secret}
    AIRFLOW__FAB__CONFIG_FILE: /opt/airflow/webserver_config.py
    AIRFLOW_OAUTH_CLIENT_ID: ${AIRFLOW_OAUTH_CLIENT_ID:-airflow-auth}
    AIRFLOW_OAUTH_CLIENT_SECRET: ${AIRFLOW_OAUTH_CLIENT_SECRET:-airflow-auth-secret}
    AIRFLOW_OAUTH_ISSUER_URL: ${AIRFLOW_OAUTH_ISSUER_URL:-http://localhost:8081/realms/vkr}
    AIRFLOW_OAUTH_INTERNAL_ISSUER_URL: ${AIRFLOW_OAUTH_INTERNAL_ISSUER_URL:-http://host.docker.internal:8081/realms/vkr}
    AIRFLOW_OAUTH_PROVIDER_NAME: ${AIRFLOW_OAUTH_PROVIDER_NAME:-keycloak}
    AIRFLOW_OAUTH_SCOPE: ${AIRFLOW_OAUTH_SCOPE:-openid email profile}
    PYTHONPATH: /opt/airflow
    CONTRACTS_SERVICE_URL: ${CONTRACTS_SERVICE_URL:-http://host.docker.internal:8000}
    CONTRACTS_OIDC_TOKEN_URL: ${CONTRACTS_OIDC_TOKEN_URL:-http://host.docker.internal:8081/realms/vkr/protocol/openid-connect/token}
    CONTRACTS_OIDC_CLIENT_ID: ${CONTRACTS_OIDC_CLIENT_ID:-airflow-contracts}
    CONTRACTS_OIDC_CLIENT_SECRET: ${CONTRACTS_OIDC_CLIENT_SECRET:-airflow-contracts-secret}
    CONTRACTS_OIDC_SCOPE: ${CONTRACTS_OIDC_SCOPE:-}
    CONTRACTS_OIDC_VERIFY_SSL: ${CONTRACTS_OIDC_VERIFY_SSL:-false}
    AUDIT_DATABASE_DSN: ${AUDIT_DATABASE_DSN:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/dag_audit}
    LANDING_S3_BUCKET: ${LANDING_S3_BUCKET:-ingestion-landing}
    LANDING_S3_PREFIX: ${LANDING_S3_PREFIX:-accepted}
    LANDING_S3_ENDPOINT_URL: ${LANDING_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
    LANDING_S3_REGION: ${LANDING_S3_REGION:-us-east-1}
    LANDING_S3_VERIFY_SSL: ${LANDING_S3_VERIFY_SSL:-false}
    KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://host.docker.internal:8081/realms/vkr/protocol/openid-connect/token}
    KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-airflow-minio-sts}
    KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-airflow-minio-sts-secret}
    MINIO_STS_ENDPOINT: ${MINIO_STS_ENDPOINT:-http://host.docker.internal:9000}
    MINIO_STS_DURATION_SECONDS: ${MINIO_STS_DURATION_SECONDS:-3600}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ../dags:/opt/airflow/dags
    - ../ingestion_airflow:/opt/airflow/ingestion_airflow
    - airflow_logs:/opt/airflow/logs

services:
  airflow-init:
    <<: *airflow-common
    container_name: ingestion-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        python -m ingestion_airflow.db.migrations --database-url "$${AUDIT_DATABASE_DSN}" upgrade

  airflow-api-server:
    <<: *airflow-common
    container_name: ingestion-airflow-api-server
    command: api-server
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: ingestion-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ingestion-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
