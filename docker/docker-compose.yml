x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: ingestion-airflow/docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_METADATA_DSN:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/data_lake}
    PYTHONPATH: /opt/airflow
    CONTRACTS_SERVICE_URL: ${CONTRACTS_SERVICE_URL:-http://host.docker.internal:8000}
    AUDIT_DATABASE_DSN: ${AUDIT_DATABASE_DSN:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/dag_audit}
    LANDING_S3_BUCKET: ${LANDING_S3_BUCKET:-ingestion-landing}
    LANDING_S3_PREFIX: ${LANDING_S3_PREFIX:-accepted}
    LANDING_S3_ENDPOINT_URL: ${LANDING_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
    LANDING_S3_REGION: ${LANDING_S3_REGION:-us-east-1}
    LANDING_S3_VERIFY_SSL: ${LANDING_S3_VERIFY_SSL:-false}
    KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://host.docker.internal:8081/realms/vkr/protocol/openid-connect/token}
    KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-airflow-minio-sts}
    KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-airflow-minio-sts-secret}
    MINIO_STS_ENDPOINT: ${MINIO_STS_ENDPOINT:-http://host.docker.internal:9000}
    MINIO_STS_DURATION_SECONDS: ${MINIO_STS_DURATION_SECONDS:-3600}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ../dags:/opt/airflow/dags
    - ../ingestion_airflow:/opt/airflow/ingestion_airflow
    - airflow_logs:/opt/airflow/logs

services:
  airflow-init:
    <<: *airflow-common
    container_name: ingestion-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        python -m ingestion_airflow.db.migrations --database-url "$${AUDIT_DATABASE_DSN}" upgrade
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: ingestion-airflow-webserver
    command: webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: ingestion-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
