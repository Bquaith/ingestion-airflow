[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion-airflow"
version = "0.1.0"
description = "Airflow runtime for ingestion-core hash-diff pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Data Platform Team" }
]
dependencies = [
  "SQLAlchemy>=1.4.36,<2.0",
  "alembic>=1.13,<2",
  "boto3==1.39.11",
  "psycopg2-binary==2.9.10",
  "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4"
]
dev = [
  "build>=1.2,<2"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ingestion_airflow*"]

[tool.setuptools.package-data]
"ingestion_airflow.alembic" = ["script.py.mako"]

[tool.pytest.ini_options]
pythonpath = [".", "../ingestion-core"]
testpaths = ["tests"]
